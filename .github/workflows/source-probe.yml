name: 书源探测

on:
  push:
    paths: ["scripts/probe-sources.txt", ".github/workflows/source-probe.yml"]
  workflow_dispatch:
    inputs:
      source_url:
        description: 书源 JSON 地址（留空用 scripts/probe-sources.txt）
        required: false
      keyword:
        description: 搜索关键词
        required: false
        default: 斗罗大陆

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
      - name: 缓存 SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Legado.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: 下载书源
        env:
          SRC: ${{ inputs.source_url }}
        run: |
          if [ -n "$SRC" ]; then echo "$SRC" > urls.txt; else grep -v '^#' scripts/probe-sources.txt > urls.txt; fi
          i=0; while read -r u; do [ -z "$u" ] && continue; i=$((i+1)); curl -sSL --compressed -m 60 -o "$RUNNER_TEMP/s$i.json" "$u"; done < urls.txt
          python3 - <<'PY'
          import json, glob, os
          out = []
          for f in sorted(glob.glob(os.environ["RUNNER_TEMP"] + "/s*.json")):
              d = json.load(open(f, encoding="utf-8-sig"))
              out += d if isinstance(d, list) else [d]
          json.dump(out, open(os.environ["RUNNER_TEMP"] + "/source.json", "w"), ensure_ascii=False)
          print("sources:", [s.get("bookSourceName") for s in out])
          PY
      - name: 探测发现与搜索
        env:
          LEGADO_EXPLORE_PROBE_FILE: ${{ runner.temp }}/source.json
          LEGADO_SOURCE_CHAIN_FILE: ${{ runner.temp }}/source.json
          LEGADO_SOURCE_PROBE_KEYWORD: ${{ inputs.keyword || '斗罗大陆' }}
          LEGADO_JS_TRACE: "1"
        run: |
          swift build --build-tests --disable-sandbox > build.log 2>&1 || { grep -n "error:" build.log | head -50; exit 1; }
          swift test --skip-build --disable-sandbox --filter "BookSourceRemoteProbe" 2>&1 | grep -E "EXPLORE|SEARCH|SOURCE_CHAIN|JS_TRACE|error|✘|passed|failed" | cut -c1-4000
